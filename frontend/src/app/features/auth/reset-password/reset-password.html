<div class="rp-page">

    <div class="rp-hero">
        <div class="rp-icon-circle">
            <i class="fa-light fa-lock"></i>
        </div>
        <h1 class="rp-title">{{ 'auth.resetPassword.title' | translate }}</h1>
    </div>

    <div class="rp-card">
        @if (failed()) {
            <div class="rp-error-banner">
                <p>{{ 'auth.toast.reset_expired' | translate }}</p>
                <button class="submit-btn" type="button" (click)="openForgotPassword()">
                    {{ 'forgot.title' | translate }}
                </button>
            </div>
        } @else {
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <div class="field">
                    <label class="field-label">{{ 'auth.resetPassword.newPasswordLabel' | translate }}</label>
                    <div class="input-wrap">
                        <i class="fa-light fa-lock input-icon"></i>
                        <input
                            class="field-input"
                            [type]="showPassword() ? 'text' : 'password'"
                            formControlName="password"
                            [class.invalid]="form.controls.password.invalid && form.controls.password.touched"
                        />
                        @if (form.controls.password.value) {
                            <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())">
                                <i class="fa-light" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
                            </button>
                        }
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">{{ 'auth.resetPassword.confirmPasswordLabel' | translate }}</label>
                    <div class="input-wrap">
                        <i class="fa-light fa-lock input-icon"></i>
                        <input
                            class="field-input"
                            [type]="showConfirmPassword() ? 'text' : 'password'"
                            formControlName="confirmPassword"
                            [class.invalid]="(form.controls.confirmPassword.invalid && form.controls.confirmPassword.touched) || passwordMismatch"
                        />
                        @if (form.controls.confirmPassword.value) {
                            <button type="button" class="eye-btn" (click)="showConfirmPassword.set(!showConfirmPassword())">
                                <i class="fa-light" [class.fa-eye]="!showConfirmPassword()" [class.fa-eye-slash]="showConfirmPassword()"></i>
                            </button>
                        }
                    </div>
                </div>

                <button class="submit-btn" type="submit" [disabled]="form.invalid || submitting()">
                    {{ 'auth.resetPassword.submit' | translate }}
                </button>

            </form>

            <button class="back-link" type="button" (click)="openForgotPassword()">{{ 'forgot.title' | translate }}</button>
        }
    </div>

</div>
