<div class="cd-content">
  @if (plannerSvc.legPairs().length === 0) {
    <p class="cd-empty">{{ 'trip.planner.step2.noLegs' | translate }}</p>
  }
  @for (pair of plannerSvc.legPairs(); track pair.from.id + pair.to.id) {
    <app-connection-leg-picker [fromStop]="pair.from" [toStop]="pair.to" (resolved)="onLegResolved()" />
  }
</div>
