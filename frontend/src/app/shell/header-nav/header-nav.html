<p-menubar class="header-nav">
  <ng-template #start>
    <a class="brand" [routerLink]="langSvc.localize([])">
      <img class="brand-logo" src="/assets/as_logo.png" alt="" />
      ActivSwitzerland
    </a>
  </ng-template>

  <ng-template #end>
    <button type="button" class="toggle-btn" aria-label="Toggle menu" (click)="toggleMenu()">
      <i class="fa-solid fa-bars-staggered"></i>
    </button>
  </ng-template>
</p-menubar>
