server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|svg|woff2?|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Unhashed content: always revalidate so deploys are visible without a hard refresh.
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    # Generated at build time (scripts/generate-sitemap.mjs) — real static
    # files, served directly rather than through the SSR proxy below.
    location = /robots.txt {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
    }

    # The bare root has no static index.html (see the Dockerfile's rm -f
    # comment) and no locale prefix to match a prerendered directory, so
    # $uri/ below would otherwise match the web root itself (which always
    # "exists") and dead-end in a 403 rather than reaching @ssr. Force it
    # straight to SSR with a candidate that can never exist on disk.
    location = / {
        try_files /this-path-never-exists @ssr;
    }

    location / {
        # Prerendered routes are real static files/directories under
        # dist/frontend/browser (e.g. destinations/<id>/index.html) and are
        # served directly here. Anything without a matching static file —
        # SSR routes (explore-trips, search), client-only routes
        # (trip-planner, auth), and unknown paths — falls through to the
        # Node SSR server instead of the old SPA catch-all, so those pages
        # get real server-rendered HTML/meta instead of an empty shell.
        try_files $uri $uri/ @ssr;
    }

    location @ssr {
        proxy_pass http://frontend-ssr:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
