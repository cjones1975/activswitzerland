services:
  mongodb:
    image: mongo:7
    container_name: activswitzerland_mongodb
    restart: unless-stopped
    env_file:
      - .env.prod
    # Loopback-only — never reachable from the LAN/internet directly. Lets
    # you reach Mongo from a dev machine via an SSH tunnel (e.g. for Compass)
    # without exposing it more broadly. Safe to remove if unused for a while.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ${MONGO_DATA_PATH:-./data/mongodb}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: activswitzerland_redis
    restart: unless-stopped
    # Persisted (AOF) so a restart/deploy doesn't come back with an empty cache and
    # re-fetch everything from MySwitzerland in one burst. Memory-capped with LRU
    # eviction since stale fallbacks are kept 7 days (backend/src/middleware/cache.js).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app_network

  backend:
    image: ghcr.io/cjones1975/activswitzerland-backend:${IMAGE_TAG:-latest}
    container_name: activswitzerland_backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  frontend-ssr:
    image: ghcr.io/cjones1975/activswitzerland-frontend-ssr:${IMAGE_TAG:-latest}
    container_name: activswitzerland_frontend_ssr
    restart: unless-stopped
    environment:
      # destinations, destinations/:id, explore-trips, and search render
      # live per request — this is the compose-network address, distinct
      # from whatever reached the backend at image build time.
      SSR_API_URL: http://backend:3000
      # Required — Angular's SSR host check rejects (silently falls back to
      # CSR) any request whose Host header isn't listed here. See
      # infra/.env.prod.example.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS}
    depends_on:
      - backend
    networks:
      - app_network

  frontend:
    image: ghcr.io/cjones1975/activswitzerland-frontend:${IMAGE_TAG:-latest}
    container_name: activswitzerland_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
      - frontend-ssr
    networks:
      - app_network

  # Cloudflare Tunnel connector — the only public ingress. Without it Cloudflare returns
  # Error 1033. Public hostnames/ingress targets are configured on the tunnel in the
  # Cloudflare Zero Trust dashboard, not here.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: activswitzerland_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - app_network

  mongo-express:
    image: mongo-express:1
    container_name: activswitzerland_mongo_express
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGO_URI}
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
