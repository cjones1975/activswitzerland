services:
  mongodb:
    image: mongo:7
    container_name: activswitzerland_mongodb
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ${MONGO_DATA_PATH:-./data/mongodb}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: activswitzerland_redis
    restart: unless-stopped
    networks:
      - app_network

  backend:
    image: ghcr.io/cjones1975/activswitzerland-backend:${IMAGE_TAG:-latest}
    container_name: activswitzerland_backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  frontend:
    image: ghcr.io/cjones1975/activswitzerland-frontend:${IMAGE_TAG:-latest}
    container_name: activswitzerland_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - app_network

  mongo-express:
    image: mongo-express:1
    container_name: activswitzerland_mongo_express
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGO_URI}
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
